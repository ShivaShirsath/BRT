version: '3.9'

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: brt-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - dbf-service

  frontend:
    image: node:22-alpine
    container_name: brt-frontend
    working_dir: /app
    command: sh -c "npm ci && npm run build && npm run preview -- --host 0.0.0.0 --port 4173"
    volumes:
      - ../:/app
    environment:
      - VITE_API_BASE=/api/v1
      - VITE_DBF_BASE=/dbf
    expose:
      - "4173"

  backend:
    image: eclipse-temurin:21-jre
    container_name: brt-backend
    working_dir: /app
    command: sh -c "test -f target/backend-java-0.0.1-SNAPSHOT.jar && java -jar target/backend-java-0.0.1-SNAPSHOT.jar || (echo 'Jar file not found in target/' && sleep infinity)"
    volumes:
      - ../backend-java:/app
    environment:
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/brt
      - SPRING_DATASOURCE_USERNAME=brt
      - SPRING_DATASOURCE_PASSWORD=brt
      - SPRING_FLYWAY_VALIDATE_ON_MIGRATE=false
      - SPRING_REDIS_HOST=redis
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "8080:8081"

  dbf-service:
    image: python:3.12-slim
    container_name: brt-dbf-service
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8090"
    volumes:
      - ../service-dbf-python:/app
      - /Users/shiva/Downloads/wmarket/DATA:/legacy-data:ro
    environment:
      - DBF_SOURCE_DIR=/legacy-data
      - CORE_API_BASE=http://backend:8081/api/v1
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - rabbitmq
    expose:
      - "8090"

  postgres:
    image: postgres:16-alpine
    container_name: brt-postgres
    environment:
      - POSTGRES_DB=brt
      - POSTGRES_USER=brt
      - POSTGRES_PASSWORD=brt
    ports:
      - "5432:5432"
    volumes:
      - brt_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: brt-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: brt-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  brt_pg:
